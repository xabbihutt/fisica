<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tipos de enlace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday classroom tool, clear and calm
   IDEA the wall periodic table plus Lewis dot diagrams drawn on the board
   PICTURE a stage where valence electrons travel between atoms, then the notebook Lewis notation
   COLOUR white ground, cobalt header band, blue and red electrons, tiles tinted metal / no metal / noble gas
   TYPE Lexend throughout
   LAYOUT table and choices left, stage and explanation right; stage first on narrow screens */
:root{color-scheme:light;--bg:#ffffff;--ink:#141a22;--mut:#566170;--line:#dce2ea;--panel:#f5f7fb;--band:#1d3fae;--metal:#d4e4ff;--nm:#ffe0c7;--ng:#e8ddfc;--off:#f0f2f5;--ca:#1765d8;--cb:#d63a20;--ok:#11804f;--bad:#c62828;--acc:#1d3fae}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f141b;--ink:#e8edf4;--mut:#9aa7b7;--line:#2a3442;--panel:#151c26;--band:#13245e;--metal:#1f3a63;--nm:#4f2e1b;--ng:#36295a;--off:#19202a;--ca:#62a4ff;--cb:#ff7d5e;--ok:#4fd49a;--bad:#ff7a7a;--acc:#8fb0ff}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f141b;--ink:#e8edf4;--mut:#9aa7b7;--line:#2a3442;--panel:#151c26;--band:#13245e;--metal:#1f3a63;--nm:#4f2e1b;--ng:#36295a;--off:#19202a;--ca:#62a4ff;--cb:#ff7d5e;--ok:#4fd49a;--bad:#ff7a7a;--acc:#8fb0ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Lexend,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{background:var(--band);color:#fff;padding:18px max(4vw,16px) 0}
.tt{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 24px;max-width:1280px;margin:0 auto}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:700}
.aut{font-size:16px;opacity:.92}
.bar2{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;max-width:1280px;margin:14px auto 0}
.modes{display:flex;gap:6px}
.modes button{background:transparent;border:0;color:#fff;opacity:.8;padding:10px 18px;border-radius:10px 10px 0 0;font-weight:500;min-height:44px}
.modes button.on{background:var(--bg);color:var(--ink);opacity:1}
.langs{display:flex;gap:2px;padding-bottom:8px}
.langs button{background:transparent;border:1px solid transparent;color:#fff;opacity:.75;border-radius:8px;padding:4px 10px;min-height:36px;font-size:15px;font-weight:600}
.langs button.on{opacity:1;border-color:rgba(255,255,255,.7)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding:20px max(4vw,16px) 40px}
@media(min-width:980px){.wrap{grid-template-columns:minmax(0,480px) minmax(0,1fr)}}
@media(max-width:979px){.wrap>section:last-child{order:-1}}
.pt{display:grid;grid-template-columns:20px repeat(18,minmax(0,1fr));gap:2px;user-select:none}
.pt .cell{aspect-ratio:1;display:grid;place-items:center;font-size:13px;border-radius:4px;background:var(--off);color:var(--mut);border:0;padding:0;letter-spacing:-.02em}
.pt .gh,.pt .ph{font-size:12px;color:var(--mut);display:grid;place-items:center}
.pt .e{font-weight:600;color:var(--ink)}
.pt .m{background:var(--metal)}.pt .nm{background:var(--nm)}.pt .ng{background:var(--ng)}
.pt .empty{background:transparent}
.pt .selA{outline:3px solid var(--ca);outline-offset:-1px;z-index:1}
.pt .selB{outline:3px solid var(--cb);outline-offset:-1px;z-index:1}
.pt .hl{outline:3px solid var(--acc);outline-offset:-1px;z-index:1}
.pt button.e:hover{filter:brightness(.93)}
@media(max-width:420px){.pt .cell{font-size:11px}.pt{grid-template-columns:14px repeat(18,minmax(0,1fr))}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mut);margin:10px 0 18px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;text-align:left;min-height:56px}
.chip small{display:block;color:var(--mut);font-size:13px}
.chip b{font-size:20px}
.chip.on.a{border-color:var(--ca)}.chip.on.b{border-color:var(--cb)}
.hint{font-size:14px;color:var(--mut);margin:8px 0 16px}
h3{font-size:17px;margin:0 0 8px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;min-height:40px;font-size:15px}
.ex button:hover{border-color:var(--acc)}
.steps{display:flex;flex-wrap:wrap;gap:4px;list-style:none;padding:0;margin:0 0 10px}
.steps button{border:0;background:var(--off);border-radius:8px;padding:6px 10px;font-size:14px;min-height:40px;color:var(--mut)}
.steps button.on{background:var(--band);color:#fff}
.steps button.done{color:var(--ink)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#stage{display:block;width:100%;height:auto;aspect-ratio:640/420}
.official{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px 6px;transition:opacity .6s}
.official p{margin:0;font-size:14px;color:var(--mut);font-weight:500}
#offsvg{display:block;width:100%;height:auto;margin:0 auto}
.navb{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 16px;min-height:44px;font-weight:500}
.btn.pri{background:var(--band);border-color:var(--band);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.btn.tog.on{border-color:var(--acc);color:var(--acc)}
.exp{font-size:16px;max-width:72ch}
.exp p{margin:0 0 10px}
.exp .note{color:var(--mut);font-size:15px}
.core{color:var(--mut)}.val{font-weight:600;color:var(--acc)}
.formula{font-size:clamp(36px,6vw,52px);font-weight:600;line-height:1.1;margin:4px 0}
.fname{font-size:18px;margin:0 0 10px;color:var(--mut)}
.exp ul{margin:4px 0 0;padding-left:20px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-weight:600;color:#fff;background:var(--acc)}
/* svg */
svg text{font-family:Lexend,system-ui,sans-serif}
.sym{font-size:20px;font-weight:600;text-anchor:middle;fill:var(--ink)}
.osym{font-size:22px;font-weight:600;text-anchor:middle;fill:var(--ink)}
.otx{font-size:20px;font-weight:500;fill:var(--ink)}
.osm{font-size:15px;fill:var(--mut)}
.c-m{fill:var(--metal);stroke:rgba(23,101,216,.4)}
.c-nm{fill:var(--nm);stroke:rgba(214,58,32,.4)}
.c-ng{fill:var(--ng);stroke:rgba(123,79,214,.5)}
.ea{fill:var(--ca)}.eb{fill:var(--cb)}
.hol{fill:none;stroke:var(--mut);stroke-dasharray:2 2}
.chg{font-size:16px;font-weight:600;fill:var(--ink)}
.cap{font-size:15px;fill:var(--mut);text-anchor:middle}
.lab{font-size:15px;fill:var(--ink);text-anchor:middle}
.big{font-size:40px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.brk{fill:none;stroke:var(--ink);stroke-width:2}
.ring{fill:none;stroke:var(--line);stroke-width:1.5}
.ring.v{stroke:var(--acc);stroke-width:2}
.card{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.bl{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.curv{fill:none;stroke:var(--mut);stroke-width:1.6}
.ahp{fill:var(--mut)}
.ahi{fill:var(--ink)}
.rarr{stroke:var(--ink);stroke-width:2}
.bonds{opacity:0;transition:opacity .4s}
#stage.lines .bonds{opacity:1}
#stage.lines .bond{opacity:0}
.e{transition:opacity .4s}
.arw{stroke:var(--mut);stroke-width:2;fill:none}
/* test */
.tbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:500;margin-bottom:10px}
.prog{height:8px;background:var(--off);border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,28px)}
.qtype{font-size:14px;color:var(--mut);margin:0 0 4px}
.qcard h2{font-size:clamp(20px,3vw,26px);line-height:1.25;margin:0 0 14px;font-weight:600}
.qsvg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opts button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;min-height:52px;font-size:18px;font-weight:500}
.opts button:hover:not([disabled]){border-color:var(--acc)}
.opts button.ok{border-color:var(--ok);background:rgba(17,128,79,.14)}
.opts button.ko{border-color:var(--bad);background:rgba(198,40,40,.12)}
.opts button[disabled]{cursor:default}
.fb{margin-top:14px;font-size:16px}
.fb .r{font-weight:600}.fb .r.ok{color:var(--ok)}.fb .r.ko{color:var(--bad)}
.slot{fill:transparent;stroke:var(--mut);stroke-dasharray:3 3;cursor:pointer}
.slot.on{fill:var(--ca);stroke:var(--ca);stroke-dasharray:none}
.final{text-align:center;padding:20px 0}
.final .formula{color:var(--acc)}
</style>
</head>
<body>
<header class="top">
  <div class="tt"><h1 data-k="title">Tipos de enlace</h1><div class="aut" data-k="author">por Xabier Díaz "Xabbihutt"</div></div>
  <div class="bar2">
    <nav class="modes"><button id="mDemo" class="on" data-k="demo">Demostración</button><button id="mTest" data-k="test">Test</button></nav>
    <div class="langs" id="langs"><button data-l="es">ES</button><button data-l="gl">GL</button><button data-l="en">EN</button></div>
  </div>
</header>
<main class="wrap">
  <section>
    <div class="pt" id="pt"></div>
    <div class="legend"><span><i style="background:var(--metal)"></i><span data-k="lMetal"></span></span><span><i style="background:var(--nm)"></i><span data-k="lNm"></span></span><span><i style="background:var(--ng)"></i><span data-k="lNg"></span></span><span data-k="lGrey"></span></div>
    <div id="demoSide">
      <div class="chips"><button class="chip a on" id="chipA"><small data-k="atom1"></small><b id="symA"></b> <span id="nameA"></span></button><button class="chip b" id="chipB"><small data-k="atom2"></small><b id="symB"></b> <span id="nameB"></span></button></div>
      <p class="hint" data-k="hint"></p>
      <h3 data-k="examples"></h3>
      <div class="ex" id="ex"></div>
    </div>
    <div id="testSide" hidden>
      <h3 data-k="howTitle"></h3>
      <p class="hint" data-k="howText"></p>
    </div>
  </section>
  <section>
    <div id="demo">
      <ol class="steps" id="steps"></ol>
      <div class="stage"><svg id="stage" viewBox="0 0 640 420" role="img"></svg></div>
      <div class="navb">
        <button class="btn" id="prev" data-k="prev"></button>
        <button class="btn pri" id="next" data-k="next"></button>
        <button class="btn" id="replay" data-k="replay"></button>
        <button class="btn tog" id="rayas"></button>
      </div>
      <div class="exp" id="exp"></div>
    </div>
    <div id="test" hidden>
      <div class="tbar"><span id="tProg"></span><span id="tScore"></span></div>
      <div class="prog"><i id="tBar"></i></div>
      <div class="qcard" id="qcard"></div>
    </div>
  </section>
</main>
<script>

 spTr:(n,ions)=>`${n[0].toUpperCase()+n.slice(1)} is a transition metal that can form ions with different charges (${ions}), so its formula cannot be worked out with the octet rule alone. You need to know which charge it uses.`,

 ionName:(m,x)=>`${m} ${x}`,

 wTipo:{ionico:'Metal + non-metal: the metal gives up electrons and ions form.',covalente:'Non-metal + non-metal: they share electrons.',metalico:'Metal + metal: a sea of electrons among cations.',ninguno:'A noble gas already has a full outer shell.'},

const SPEX={'O-S':'SO₂, SO₃','N-O':'NO, NO₂','O-P':'P₄O₁₀','C-N':'CN⁻','N-S':'S₄N₄','P-S':'P₄S₃','I-O':'I₂O₅','N-P':'P₃N₅','C-P':'—'};
let lang='es',L=TX.es;
try{const s=localStorage.getItem('enlace-lang');if(TX[s])lang=s}catch(e){}
L=TX[lang];

/* ---------- chemistry ---------- */
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹',SUBD='₀₁₂₃₄₅₆₇₈₉';
const supNum=t=>{let n='';for(const ch of t){const i=SUPD.indexOf(ch);if(i>=0)n+=i}return +n||0};
const toSup=n=>String(n).split('').map(d=>SUPD[d]).join('');
const sub=n=>n==1?'':String(n).split('').map(d=>SUBD[d]).join('');
const chg=q=>(Math.abs(q)==1?'':toSup(Math.abs(q)))+(q>0?'⁺':'⁻');
const chgTxt=q=>(Math.abs(q)==1?'':Math.abs(q))+(q>0?'+':'−');
const num=x=>lang=='en'?x.toFixed(2):x.toFixed(2).replace('.',',');
const gcd=(a,b)=>b?gcd(b,a%b):a;
const pos=z=>{if(z==1)return[1,1];if(z==2)return[18,1];if(z<=18){const p=z<=10?2:3,i=z-(p==2?2:10);return[i<=2?i:i+10,p]}return z<=36?[z-18,4]:[z-36,5]};
const EL={};
SYM.forEach((s,i)=>{const z=i+1,[g,p]=pos(z),d=D[s],e={s,z,g,p,sel:!!d};if(d){Object.assign(e,{t:d[0],en:d[1],core:d[2],val:d[3],tr:g>=3&&g<=12});e.ve=d[3].split(' ').reduce((a,x)=>a+supNum(x.slice(2)),0)}EL[s]=e});
const nm=e=>NAMES[lang][e.s]||e.s;
const need=e=>e.s=='H'?1:8-e.ve;
const duet=e=>e.s=='H'||e.s=='He';
const SEQ='B Si C Sb As P N H Te Se S At I Br Cl O F'.split(' ');
const fU=parts=>parts.map(([s,n])=>s+sub(n)).join('');
const fH=parts=>parts.map(([s,n])=>s+(n>1?`<sub>${n}</sub>`:'')).join('');
const enKey=e=>e.t=='ng'?9:e.en;
const orderPair=(a,b)=>enKey(EL[a])<=enKey(EL[b])?[a,b]:[b,a];

function analyze(a0,b0){
  const[a,b]=orderPair(a0,b0),A=EL[a],B=EL[b],R={A,B,special:null,key:[a,b].sort().join('-')};
  if(A.t=='ng'||B.t=='ng'){R.type='ninguno';return R}
  if(A.t=='m'&&B.t=='m'){R.type='metalico';R.alloy=a!=b;if(a==b)R.parts=[[a,1]];return R}
  if(A.t!=B.t){
    const M=A.t=='m'?A:B,X=A.t=='m'?B:A;R.type='ionico';R.M=M;R.X=X;
    if(M.s=='Fe'||M.s=='Cu'){R.special='tr';return R}
    if(X.s=='C'){R.special='C';return R}
    const qM=M.ve,qX=need(X),g=gcd(qM,qX);Object.assign(R,{qM,qX,nM:qX/g,nX:qM/g});
    R.parts=[[M.s,R.nM],[X.s,R.nX]];return R}
  R.type='covalente';
  if(a==b){
    if('CPS'.includes(a)&&a.length==1){R.special='same';R.sameNet=a;return R}
    Object.assign(R,{C:A,L:B,n:1,k:need(A),parts:[[a,2]]});return R}
  const va=need(A),vb=need(B);
  let C,Lg;
  if(va>vb){C=A;Lg=B}else if(vb>va){C=B;Lg=A}else{C=SEQ.indexOf(a)<SEQ.indexOf(b)?A:B;Lg=C==A?B:A}
  if(['O-S','N-P','I-O'].includes(R.key)||need(C)%need(Lg)){R.special='cov';return R}
  const n=need(C)/need(Lg),k=need(Lg);Object.assign(R,{C,L:Lg,n,k});
  R.parts=SEQ.indexOf(C.s)<SEQ.indexOf(Lg.s)?[[C.s,1],[Lg.s,n]]:[[Lg.s,n],[C.s,1]];
  return R}
function cname(R){if(!R.parts)return'';if(R.type=='ionico')return L.ionName(nm(R.M),ANION[lang][R.X.s]);const m=MOL[fU(R.parts)];return m?m[LI[lang]]:''}
function specialTxt(R){if(R.special=='tr')return L.spTr(nm(R.M),R.M.s=='Fe'?'Fe²⁺ / Fe³⁺':'Cu⁺ / Cu²⁺');if(R.special=='C')return L.spC;if(R.special=='same')return L.same[R.sameNet];return L.spCov(SPEX[R.key])}

/* ---------- drawing helpers ---------- */
const SD=[[0,-1],[1,0],[0,1],[-1,0]];
function lewis(x,y,cnt,du,r=27,o=7){
  const out=[];
  if(du){for(let i=0;i<cnt;i++)out.push([x+(cnt==1?0:(i?o:-o)),y-r]);return out}
  for(let i=0;i<cnt;i++){const sd=i%4,[dx,dy]=SD[sd],two=cnt>4+sd,f=two?(i<4?-o:o):0;out.push([x+dx*r-dy*f,y+dy*r+dx*f])}
  return out}
const kcls=e=>'c-'+e.t;
const atomSVG=(e,x,y,ec,cnt=e.ve)=>`<g><circle cx="${x}" cy="${y}" r="19" class="${kcls(e)}"/><text x="${x}" y="${y}" dy=".36em" class="sym">${e.s}</text>${lewis(x,y,cnt,duet(e)).map(([a,b])=>`<circle cx="${a}" cy="${b}" r="4.6" class="${ec}"/>`).join('')}</g>`;
const xsFor=(n,sp=170,c=320)=>Array.from({length:n},(_,i)=>c+(i-(n-1)/2)*sp);
function colOf(R,e,idx){if(R.A.s==R.B.s)return idx%2?'eb':'ea';return e.s==R.A.s?'ea':'eb'}

const DEFS=`<defs><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahp"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ahi"/></marker></defs>`;
/* ---------- animated scene engine ---------- */
const svg=$('#stage');let wTimer=null,lateTimer=null,offTimer=null;
const tr=(x,y)=>`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopTimers(){clearInterval(wTimer);clearTimeout(lateTimer);clearTimeout(offTimer)}
function render(sc,anim){
  let h=DEFS+`<g class="bonds">${sc.lines||''}</g>`;
  h+=sc.atoms.map((a,i)=>`<g id="sa${i}" style="transform:${anim?tr(a.x0,a.y0):tr(a.x1,a.y1)}"><circle r="19" class="${a.c}"/><text class="sym" dy=".36em">${a.s}</text></g>`).join('');
  h+=sc.els.map((e,i)=>`<circle r="4.6" id="se${i}" class="e ${e.c}${e.bond?' bond':''}" style="transform:${anim?tr(e.x0,e.y0):tr(e.x1,e.y1)}"/>`).join('');
  const tok=String(Math.random());h+=`<g id="late" data-t="${tok}" style="opacity:${anim?0:1};transition:opacity .6s">${sc.extra||''}</g>`;
  svg.innerHTML=h;
  if(anim){svg.getBoundingClientRect();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!$('#late')||$('#late').dataset.t!=tok)return;
      sc.atoms.forEach((a,i)=>{const g=$('#sa'+i);g.style.transition=`transform ${a.dur||1.2}s ease-in-out ${a.d||0}s`;g.style.transform=tr(a.x1,a.y1)});
      sc.els.forEach((e,i)=>{const c=$('#se'+i);c.style.transition=`transform ${e.dur||1}s ease-in-out ${e.d||0}s,opacity .4s`;c.style.transform=tr(e.x1,e.y1)});
      $('#late').style.transitionDelay=(sc.late||1)+'s';$('#late').style.opacity=1}))}
  if(sc.wander){const go=()=>{const els=[...svg.querySelectorAll('.e')];const step=()=>els.forEach(c=>{const[x,y]=sc.wander();c.style.transition='transform 1.8s linear';c.style.transform=tr(x,y)});step();wTimer=setInterval(step,1800)};
    if(anim)lateTimer=setTimeout(go,(sc.late||1)*1000+300);else go()}
  return anim}

/* ionic: metals in the left column, non-metals in the right column, as in the formula */
function sceneIonic(R){
  const{M,X,nM,nX,qM,qX}=R,ym=xsFor(nM,112,195),yx=xsFor(nX,112,195),xm=190,xx=450,atoms=[],els=[],moves=[];
  const full=X.s=='H'?2:8,cm=colOf(R,M),cx=colOf(R,X),q=[];
  yx.forEach(y=>{atoms.push({s:X.s,c:kcls(X),x0:xx,y0:y,x1:xx,y1:y});const fin=lewis(xx,y,full,duet(X)),ini=lewis(xx,y,X.ve,duet(X));
    ini.forEach((p,i)=>els.push({c:cx,x0:p[0],y0:p[1],x1:fin[i][0],y1:fin[i][1],d:.2,dur:.8}));
    for(let t=X.ve;t<full;t++)q.push(fin[t])});
  let k=0;
  ym.forEach(y=>{atoms.push({s:M.s,c:kcls(M),x0:xm,y0:y,x1:xm,y1:y});lewis(xm,y,M.ve,false).forEach(p=>{const f=q[k];moves.push([p,f]);els.push({c:cm,x0:p[0],y0:p[1],x1:f[0],y1:f[1],d:.4+k*.45,dur:1.1});k++})});
  const late=.4+k*.45+1.1;
  let ex=ym.map(y=>`<text x="${xm-30}" y="${y-22}" class="chg" style="text-anchor:end">${chgTxt(qM)}</text>`).join('');
  ex+=yx.map(y=>`<path class="brk" d="M${xx-38} ${y-44}h-7v88h7M${xx+38} ${y-44}h7v88h-7"/><text x="${xx+48}" y="${y-40}" class="chg">${chgTxt(-qX)}</text>`).join('');
  ex+=moves.map(([p,f],i)=>{const dx=f[0]-p[0],dy=f[1]-p[1],Lg=Math.hypot(dx,dy),ux=dx/Lg,uy=dy/Lg,b=-(28+(i%3)*10),cx=(p[0]+f[0])/2-uy*b,cy=(p[1]+f[1])/2+ux*b,ex2=f[0]-ux*8,ey2=f[1]-uy*8;
    return`<circle cx="${p[0]}" cy="${p[1]}" r="4.6" class="${cm}"/><path class="curv" marker-end="url(#ahm)" d="M${(p[0]+ux*7).toFixed(1)} ${(p[1]+uy*7).toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex2.toFixed(1)} ${ey2.toFixed(1)}"/>`}).join('');
  ex+=`<text x="320" y="405" class="cap">${L.capIon}</text>`;
  return{atoms,els,extra:ex,late}}

function sceneCov(R){
  const{C,L:Lg,n,k}=R,dirs={1:[[1,0]],2:[[-1,0],[1,0]],3:[[-1,0],[1,0],[0,1]],4:[[0,-1],[1,0],[0,1],[-1,0]]}[n];
  const Cf=n==1?[270,200]:n==3?[320,180]:[320,205],d=100,Ci=n==1?[180,200]:Cf;
  const cc=R.A.s==R.B.s?'ea':colOf(R,C),cl=R.A.s==R.B.s?'eb':colOf(R,Lg);
  const atoms=[{s:C.s,c:kcls(C),x0:Ci[0],y0:Ci[1],x1:Cf[0],y1:Cf[1]}],els=[];let lines='';
  const cIni=lewis(Ci[0],Ci[1],C.ve,duet(C)),cFin=[];
  const pairAt=(P,s)=>{const p=[-s[1],s[0]];return[[P[0]+s[0]*25+p[0]*6,P[1]+s[1]*25+p[1]*6],[P[0]+s[0]*25-p[0]*6,P[1]+s[1]*25-p[1]*6]]};
  const pick=(lp,outer,perps,free)=>{const ord=lp==1?[outer,...perps]:[...perps,outer];return ord.filter(s=>free.some(f=>f[0]==s[0]&&f[1]==s[1])).slice(0,lp)};
  dirs.forEach(u=>{
    const p=[-u[1],u[0]],Lf=[Cf[0]+u[0]*d,Cf[1]+u[1]*d],ext=u[1]?150:185,Li=n==1?[460,200]:[Cf[0]+u[0]*ext,Cf[1]+u[1]*ext];
    atoms.push({s:Lg.s,c:kcls(Lg),x0:Li[0],y0:Li[1],x1:Lf[0],y1:Lf[1]});
    const mid=[Cf[0]+u[0]*d/2,Cf[1]+u[1]*d/2],lFin=[];
    for(let j=0;j<k;j++){const o=(j-(k-1)/2)*11;cFin.push({p:[mid[0]-u[0]*5+p[0]*o,mid[1]-u[1]*5+p[1]*o],bond:1});lFin.push({p:[mid[0]+u[0]*5+p[0]*o,mid[1]+u[1]*5+p[1]*o],bond:1});
      const o2=(j-(k-1)/2)*8;lines+=`<line class="bl" x1="${Cf[0]+u[0]*22+p[0]*o2}" y1="${Cf[1]+u[1]*22+p[1]*o2}" x2="${Lf[0]-u[0]*22+p[0]*o2}" y2="${Lf[1]-u[1]*22+p[1]*o2}"/>`}
    pick((Lg.ve-k)/2,u,[p,[-p[0],-p[1]]],SD).forEach(s=>pairAt(Lf,s).forEach(q=>lFin.push({p:q})));
    lewis(Li[0],Li[1],Lg.ve,duet(Lg)).forEach((q,i)=>els.push({c:cl,x0:q[0],y0:q[1],x1:lFin[i].p[0],y1:lFin[i].p[1],bond:lFin[i].bond,d:.1+i*.03,dur:1.3}))});
  const u0=dirs[0],p0=[-u0[1],u0[0]],free=SD.filter(s=>!dirs.some(u=>u[0]==s[0]&&u[1]==s[1]));
  pick((C.ve-n*k)/2,[-u0[0],-u0[1]],[p0,[-p0[0],-p0[1]]],free).forEach(s=>pairAt(Cf,s).forEach(q=>cFin.push({p:q})));
  cIni.forEach((q,i)=>els.push({c:cc,x0:q[0],y0:q[1],x1:cFin[i].p[0],y1:cFin[i].p[1],bond:cFin[i].bond,d:.1+i*.03,dur:1.3}));
  atoms.forEach(a=>{a.dur=1.3;a.d=.1});
  const ex=`<text x="320" y="400" class="cap">${L.capCov(n,k,(C.ve-n*k)/2,(Lg.ve-k)/2,C.s,Lg.s,C.s==Lg.s)}</text>`;
  return{atoms,els,lines,extra:ex,late:1.5}}

function sceneMetal(R){
  const atoms=[],els=[],pts=[];
  for(let r=0;r<3;r++)for(let i=0;i<5;i++){const e=R.alloy&&(i+r)%2?R.B:R.A,x=96+i*112,y=90+r*112;pts.push([x,y]);atoms.push({s:e.s,c:kcls(e),x0:x,y0:y,x1:x,y1:y,e})}
  const rnd=()=>{for(let t=0;t<40;t++){const x=30+Math.random()*580,y=40+Math.random()*320;if(pts.every(([a,b])=>(a-x)**2+(b-y)**2>26**2))return[x,y]}return[320,30]};

function answer(v){const q=T.q[T.i];if(q.done)return;q.done=true;q.ans=v;if(v==q.ok)T.score++;paint(q)}
function paint(q){const ok=q.ans==q.ok;
  if(q.t!='lewis')document.querySelectorAll('#qOpts button').forEach(b=>{b.disabled=true;if(b.dataset.o==q.ok)b.classList.add('ok');else if(b.dataset.o==q.ans)b.classList.add('ko')});
  else{$('#qCheck').disabled=true;$('#qClear').disabled=true}
  const extra=q.t=='lewis'?`<svg class="qsvg" viewBox="0 0 300 110" style="max-width:240px;margin:8px 0 0">${atomSVG(EL[q.els[0]],150,58,'ea')}</svg>`:'';
  $('#qFb').innerHTML=`<p><span class="r ${ok?'ok':'ko'}">${ok?L.right:L.wrong}</span> ${q.t=='lewis'&&!ok?L.placed(q.ans)+' ':''}${!ok&&q.t!='lewis'?L.answerIs(optLabel(q,q.ok))+' ':''}${qWhy(q)}</p>${extra}`;
  $('#qNav').hidden=false;$('#tScore').textContent=L.qScore(T.score)}
function showEnd(){$('#tBar').style.width='100%';$('#tProg').textContent=L.finished;$('#tScore').textContent=L.qScore(T.score);
  document.querySelectorAll('.pt .cell').forEach(c=>c.classList.remove('hl'));
  const s=T.score,n=T.q.length,msg=L.endMsg[s==n?0:s>=8?1:s>=5?2:3];
  $('#qcard').innerHTML=`<div class="final"><p class="qtype">${L.result}</p><div class="formula">${s} / ${n}</div><p class="fname">${msg}</p><button class="btn pri" id="again">${L.newTest}</button></div>`;
  $('#again').onclick=startTest}
function startTest(){T={q:genTest(),i:0,score:0};showQ()}
function setMode(m){mode=m;$('#mDemo').classList.toggle('on',m=='demo');$('#mTest').classList.toggle('on',m=='test');
  $('#demo').hidden=m!='demo';$('#demoSide').hidden=m!='demo';$('#test').hidden=m!='test';$('#testSide').hidden=m!='test';
  document.querySelectorAll('.pt button.e').forEach(b=>b.tabIndex=m=='demo'?0:-1);
  if(m=='demo')drawDemo();else{stopTimers();if(!T)startTest();else if(T.i>=T.q.length)showEnd();else showQ()}}
$('#mDemo').onclick=()=>setMode('demo');$('#mTest').onclick=()=>setMode('test');

/* ---------- language ---------- */
function applyLang(){L=TX[lang];document.documentElement.lang=lang;document.title=L.title;
  document.querySelectorAll('[data-k]').forEach(el=>el.textContent=L[el.dataset.k]);
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l==lang));
  document.querySelectorAll('.pt button.e').forEach(b=>b.title=nm(EL[b.dataset.s]));
  try{localStorage.setItem('enlace-lang',lang)}catch(e){}}
$('#langs').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.dataset.l==lang)return;lang=b.dataset.l;applyLang();if(mode=='demo')drawDemo(false);else setMode('test')});
applyLang();setMode('demo');
}
</script>
