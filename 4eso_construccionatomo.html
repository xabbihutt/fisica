.sub{margin:2px 0 0;color:var(--mut)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:12px 20px 20px;max-width:1200px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{position:relative}
canvas{width:100%;aspect-ratio:760/600;display:block;border:1px solid var(--line);border-radius:14px;touch-action:none;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--mut)}
.btn{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:focus-visible{outline:3px solid var(--e);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--e);border-color:var(--e);color:#fff}
.go{background:var(--ink);color:var(--card);width:100%;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nr{text-align:center}
.nt{display:inline-flex;align-items:center;line-height:1;min-height:56px}
.ab{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;height:50px;font-size:20px;margin-right:3px}
.sy{font-size:54px;font-weight:600}
.ch{align-self:flex-start;font-size:22px;margin-left:2px}
.nm{color:var(--mut);font-size:13px;min-height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.dot{width:12px;height:12px;border-radius:50%}
.mrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.mrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.fn{margin:8px 0 0;color:var(--mut);font-size:12.5px}
#win{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;text-align:center;display:none;pointer-events:none;max-width:90%}
#toast{position:absolute;left:50%;top:77%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:7px 12px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(31,157,85,.35)}}
.pulse{animation:pulse 1s infinite}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}

<div><button class="btn" id="lE" aria-pressed="true">ES</button> <button class="btn" id="lG" aria-pressed="false">GL</button> <button class="btn" id="lN" aria-pressed="false">EN</button></div></header>

function pt(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*W/r.width]}

function pick(){

  const zs=[];for(let z=1;z<=20;z++)if(mode==='N'||CH[z])zs.push(z);

function update(dt){

  if(p.s==='a'){
